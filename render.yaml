services:
  - type: web
    name: orbitalguard-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEMETRY_MODE
        value: simulation
      - key: FRONTEND_ORIGIN
        value: https://kvigneshsivan-bot.github.io